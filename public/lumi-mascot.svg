<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Sky Body Gradient -->
    <radialGradient id="lumiBodyGrad" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="18%" stop-color="#E0F2FE" />
      <stop offset="55%" stop-color="#7DD3FC" />
      <stop offset="85%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </radialGradient>

    <!-- Golden Headphones Gradient -->
    <linearGradient id="lumiGoldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Headphone Ridge Shading -->
    <linearGradient id="lumiOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Sparkling Anime Eye Iris -->
    <radialGradient id="lumiEyeIris" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="35%" stop-color="#1E3A8A" />
      <stop offset="65%" stop-color="#2563EB" />
      <stop offset="88%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </radialGradient>

    <!-- Glowing Heart Gradient -->
    <linearGradient id="lumiHeartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="90%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Heart Glow Filter -->
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- AMBIENT SOFT SHADOW -->
  <ellipse cx="250" cy="468" rx="110" ry="18" fill="#0F172A" fill-opacity="0.12" />

  <!-- HEADPHONE CONNECTOR BAND BEHIND HEAD -->
  <path d="M 120 220 C 105 100, 395 100, 380 220" fill="none" stroke="#D97706" stroke-width="18" stroke-linecap="round" />
  <path d="M 120 220 C 105 100, 395 100, 380 220" fill="none" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" />

  <!-- BODY & LEGS BASE -->
  <g id="body-and-legs">
    <!-- Lower Body -->
    <path d="M 190 330 C 170 370, 165 425, 210 435 C 235 438, 245 400, 250 400 C 255 400, 265 438, 290 435 C 335 425, 330 370, 310 330 Z" 
          fill="url(#lumiBodyGrad)" stroke="#0284C7" stroke-width="6" stroke-linejoin="round" />

    <!-- Golden Feet / Shoes -->
    <!-- Left Shoe -->
    <ellipse cx="205" cy="452" rx="36" ry="18" fill="url(#lumiOrangeGrad)" stroke="#9A3412" stroke-width="4" />
    <ellipse cx="205" cy="448" rx="32" ry="14" fill="url(#lumiGoldGrad)" />
    <ellipse cx="202" cy="445" rx="16" ry="6" fill="#FFFFFF" fill-opacity="0.75" />

    <!-- Right Shoe -->
    <ellipse cx="295" cy="452" rx="36" ry="18" fill="url(#lumiOrangeGrad)" stroke="#9A3412" stroke-width="4" />
    <ellipse cx="295" cy="448" rx="32" ry="14" fill="url(#lumiGoldGrad)" />
    <ellipse cx="292" cy="445" rx="16" ry="6" fill="#FFFFFF" fill-opacity="0.75" />
  </g>

  <!-- HEAD & DROPLET SILHOUETTE -->
  <g id="head">
    <!-- Main Droplet Head Shape with Top Curled Tuft -->
    <path d="
      M 250 35
      C 260 22, 275 25, 278 40
      C 280 58, 268 70, 258 88
      C 320 105, 395 160, 388 250
      C 382 320, 315 350, 250 350
      C 185 350, 118 320, 112 250
      C 105 160, 180 105, 242 88
      C 232 70, 222 55, 230 40
      C 235 30, 244 26, 250 35 Z
    " 
    fill="url(#lumiBodyGrad)" 
    stroke="#0284C7" 
    stroke-width="7" 
    stroke-linejoin="round" />

    <!-- Top Tuft Droplet Highlight Curve -->
    <path d="M 245 48 C 255 35, 268 40, 268 52 C 265 65, 255 75, 250 82" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- Soft Forehead Gloss Light -->
    <ellipse cx="205" cy="140" rx="42" ry="24" transform="rotate(-25 205 140)" fill="#FFFFFF" fill-opacity="0.45" />
    <ellipse cx="295" cy="120" rx="20" ry="10" transform="rotate(20 295 120)" fill="#FFFFFF" fill-opacity="0.3" />
  </g>

  <!-- HEADPHONES (EARMUFFS ON SIDES) -->
  <!-- Left Earphone -->
  <g id="left-earphone" transform="rotate(-18 95 215)">
    <!-- Base Bracket ring -->
    <rect x="68" y="180" width="22" height="70" rx="10" fill="#EA580C" stroke="#9A3412" stroke-width="4" />
    <rect x="74" y="185" width="18" height="60" rx="8" fill="#F59E0B" />

    <!-- Concentric Acoustic Wave Ridges -->
    <ellipse cx="66" cy="215" rx="14" ry="32" fill="#EA580C" stroke="#9A3412" stroke-width="3.5" />
    <ellipse cx="64" cy="215" rx="11" ry="26" fill="#FBBF24" />
    
    <ellipse cx="50" cy="215" rx="12" ry="24" fill="#EA580C" stroke="#9A3412" stroke-width="3" />
    <ellipse cx="48" cy="215" rx="9" ry="20" fill="#FBBF24" />

    <!-- Outer Knob Cap -->
    <ellipse cx="38" cy="215" rx="9" ry="16" fill="url(#lumiGoldGrad)" stroke="#9A3412" stroke-width="3" />
    <ellipse cx="36" cy="213" rx="4" ry="7" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Right Earphone -->
  <g id="right-earphone" transform="rotate(18 405 215)">
    <!-- Base Bracket ring -->
    <rect x="410" y="180" width="22" height="70" rx="10" fill="#EA580C" stroke="#9A3412" stroke-width="4" />
    <rect x="408" y="185" width="18" height="60" rx="8" fill="#F59E0B" />

    <!-- Concentric Acoustic Wave Ridges -->
    <ellipse cx="434" cy="215" rx="14" ry="32" fill="#EA580C" stroke="#9A3412" stroke-width="3.5" />
    <ellipse cx="436" cy="215" rx="11" ry="26" fill="#FBBF24" />
    
    <ellipse cx="450" cy="215" rx="12" ry="24" fill="#EA580C" stroke="#9A3412" stroke-width="3" />
    <ellipse cx="452" cy="215" rx="9" ry="20" fill="#FBBF24" />

    <!-- Outer Knob Cap -->
    <ellipse cx="462" cy="215" rx="9" ry="16" fill="url(#lumiGoldGrad)" stroke="#9A3412" stroke-width="3" />
    <ellipse cx="460" cy="213" rx="4" ry="7" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- FACIAL FEATURES -->
  <g id="face">
    <!-- EYEBROWS -->
    <path d="M 162 178 C 172 166, 192 166, 202 174" fill="none" stroke="#0369A1" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 298 174 C 308 166, 328 166, 338 178" fill="none" stroke="#0369A1" stroke-width="4.5" stroke-linecap="round" />

    <!-- ROSY CHEEKS -->
    <ellipse cx="168" cy="268" rx="18" ry="11" fill="#FB7185" fill-opacity="0.45" />
    <ellipse cx="332" cy="268" rx="18" ry="11" fill="#FB7185" fill-opacity="0.45" />

    <!-- LEFT EYE -->
    <g id="left-eye">
      <!-- Eye Base Contour & Stroke -->
      <ellipse cx="192" cy="225" rx="28" ry="36" fill="url(#lumiEyeIris)" stroke="#0F172A" stroke-width="4.5" />
      
      <!-- Cyan Crescent Light at Bottom of Iris -->
      <path d="M 172 235 C 178 252, 206 252, 212 235 C 206 245, 178 245, 172 235 Z" fill="#67E8F9" opacity="0.9" />

      <!-- Top Pupil Core -->
      <ellipse cx="192" cy="218" rx="15" ry="18" fill="#0A0F1D" />

      <!-- Sparkling Catchlight Highlights -->
      <circle cx="182" cy="210" r="9" fill="#FFFFFF" />
      <circle cx="204" cy="235" r="4.5" fill="#FFFFFF" />
      <circle cx="180" cy="230" r="2.5" fill="#FFFFFF" opacity="0.75" />

      <!-- Eyelashes / Upper Lid Flick -->
      <path d="M 160 215 C 168 190, 216 190, 224 212" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
      <path d="M 162 214 C 152 216, 146 222, 144 228" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
      <path d="M 158 208 C 150 206, 145 208, 142 212" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- RIGHT EYE -->
    <g id="right-eye">
      <!-- Eye Base Contour & Stroke -->
      <ellipse cx="308" cy="225" rx="28" ry="36" fill="url(#lumiEyeIris)" stroke="#0F172A" stroke-width="4.5" />

      <!-- Cyan Crescent Light at Bottom of Iris -->
      <path d="M 288 235 C 294 252, 322 252, 328 235 C 322 245, 294 245, 288 235 Z" fill="#67E8F9" opacity="0.9" />

      <!-- Top Pupil Core -->
      <ellipse cx="308" cy="218" rx="15" ry="18" fill="#0A0F1D" />

      <!-- Sparkling Catchlight Highlights -->
      <circle cx="298" cy="210" r="9" fill="#FFFFFF" />
      <circle cx="320" cy="235" r="4.5" fill="#FFFFFF" />
      <circle cx="296" cy="230" r="2.5" fill="#FFFFFF" opacity="0.75" />

      <!-- Eyelashes / Upper Lid Flick -->
      <path d="M 276 212 C 284 190, 332 190, 340 215" fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
      <path d="M 338 214 C 348 216, 354 222, 356 228" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
      <path d="M 342 208 C 350 206, 355 208, 358 212" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- SWEET CURVED SMILE -->
    <path d="M 236 250 C 242 260, 258 260, 264 250" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- GLOWING GOLDEN HEART IN CHEST -->
  <g id="glowing-heart" filter="url(#heartGlow)">
    <!-- Heart Background Glow -->
    <path d="
      M 250 318
      C 250 318, 235 292, 212 292
      C 190 292, 178 310, 178 330
      C 178 358, 218 385, 250 408
      C 282 385, 322 358, 322 330
      C 322 310, 310 292, 288 292
      C 265 292, 250 318, 250 318 Z
    "
    fill="url(#lumiHeartGrad)"
    stroke="#D97706"
    stroke-width="5"
    stroke-linejoin="round" />

    <!-- Top Heart Gloss Highlights -->
    <ellipse cx="215" cy="312" rx="14" ry="8" transform="rotate(-30 215 312)" fill="#FFFFFF" fill-opacity="0.8" />
    <ellipse cx="285" cy="312" rx="14" ry="8" transform="rotate(30 285 312)" fill="#FFFFFF" fill-opacity="0.8" />
  </g>

  <!-- CUTE BABY BLUE HANDS CLASPING THE HEART -->
  <g id="hands">
    <!-- Left Hand Clasping Heart -->
    <path d="
      M 168 335
      C 168 318, 195 320, 222 330
      C 230 334, 234 346, 226 352
      C 234 355, 234 366, 225 372
      C 232 376, 230 388, 220 390
      C 192 396, 168 375, 168 335 Z
    " 
    fill="url(#lumiBodyGrad)" 
    stroke="#0284C7" 
    stroke-width="4.5" 
    stroke-linejoin="round" />

    <!-- Left Hand Finger Creases -->
    <path d="M 215 348 C 205 346, 195 350, 185 352" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    <path d="M 216 368 C 206 366, 196 368, 188 370" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />

    <!-- Right Hand Clasping Heart -->
    <path d="
      M 332 335
      C 332 318, 305 320, 278 330
      C 270 334, 266 346, 274 352
      C 266 355, 266 366, 275 372
      C 268 376, 270 388, 280 390
      C 308 396, 332 375, 332 335 Z
    " 
    fill="url(#lumiBodyGrad)" 
    stroke="#0284C7" 
    stroke-width="4.5" 
    stroke-linejoin="round" />

    <!-- Right Hand Finger Creases -->
    <path d="M 285 348 C 295 346, 305 350, 315 352" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    <path d="M 284 368 C 294 366, 304 368, 312 370" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
